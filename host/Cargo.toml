# Host side of the RFP-021 prototype: turns the real mainnet vectors in
# vectors/ into program inputs, cross-checks every verdict natively, and runs
# the guests in the RISC Zero executor (r0vm 3.0.5) to count cycles.
[workspace]

[package]
name = "sextant-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
sextant-core = { path = "../core" }
bls12_381 = { version = "0.8", features = ["experimental"] }
borsh = "1.5"
hex = "0.4"
serde_json = "1"
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
risc0-binfmt = "3.0"
risc0-zkos-v1compat = "=2.2.2"

[profile.release]
opt-level = 3
