# The benchmark guest, accelerated: identical source to guest-stock, with RISC
# Zero's forks patched in so BLS12-381 field arithmetic (both zkcrypto
# bls12_381 and blst), SHA-256 and Keccak go through the zkVM's accelerators.
[workspace]

[package]
name = "sextant-bench-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "sextant_bench"
path = "src/main.rs"

[dependencies]
sextant-core = { path = "../core" }
borsh = "1.5"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[patch.crates-io]
bls12_381   = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
blst        = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
