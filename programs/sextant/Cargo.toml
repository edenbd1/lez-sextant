# sextant_lc: the Ethereum light client as a LEZ v0.3 program (RFP-021 prototype).
#
# Written against lee_core directly (SPEL has no v0.3 support), pinned to the
# v0.3.0 tag, commit db66590ab. The verification itself is sextant-core, the
# crate the host tests and the benchmark run; this crate is the plan/apply
# shell around it: instances, verification jobs and header records.
[workspace]

[package]
name    = "sextant-program"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sextant_lc"
path = "src/bin/sextant_lc.rs"

[dependencies]
sextant-core = { path = "../../core", default-features = false }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
borsh      = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# RISC Zero's accelerated forks (decision D1): blst's field arithmetic on the
# zkVM's bigint2 circuit, SHA-256 and Keccak on its hash circuits. Without
# them the pairing check alone is several times the 10,000,000-cycle budget
# (docs/BENCHMARKS.md, stock column).
[patch.crates-io]
blst        = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
