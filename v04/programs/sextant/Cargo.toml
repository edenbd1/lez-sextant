# sextant_lc on LEZ v0.4 (the actor model), at the v0.4.0-rc3 tag.
#
# The same light client as programs/sextant (LEZ v0.3): Init from a
# checkpoint, a sync-committee update in three transactions (Begin, Miller,
# Finish) bound by a job, and Attest, with the same E72xx refusal codes. The
# verification itself is sextant-core, unchanged; this crate is the actor
# shell around it (docs/V04.md).
[workspace]

[package]
name    = "sextant-program-v04"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sextant_lc"
path = "src/bin/sextant_lc.rs"

[dependencies]
sextant-core = { path = "../../../core", default-features = false }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
borsh      = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# RISC Zero's accelerated forks (decision D1), as on v0.3.
[patch.crates-io]
blst        = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
